name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: these jobs only read the repository to build and test it.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - name: Formatting
        run: zig build fmt:check
      # Docs and sources must not spell out a name, version or toolchain that the
      # manifest already carries.
      - name: Manifest is the only source
        run: zig build docs:check
      # Unit tests for core and the TUI, plus the end-to-end test that drives the
      # real binary through a pseudo-terminal.
      - name: Tests
        run: zig build test --summary all
      # A debug build is what tests use; this is the one that ships.
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe

  coverage:
    runs-on: ubuntu-latest
    # The gate asks for 100% of core/src and tui/src. It is reported, not
    # enforced, while the kcov line attribution of the newer modules (html,
    # links, png, halfblocks) is being brought back to 100%. Flip this to
    # false once `zig build coverage` is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      # The runner's repositories have no kcov package, and a kcov from Nix drags
      # its own glibc into the process: the binary under test then loads two libcs
      # and dies. Building it here keeps one libc in the picture.
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libelf-dev libdw-dev binutils-dev \
            libcurl4-openssl-dev zlib1g-dev libssl-dev
          curl -fsSL -o kcov.tar.gz https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz
          tar -xzf kcov.tar.gz
          cmake -S kcov-43 -B kcov-build -DCMAKE_BUILD_TYPE=Release
          cmake --build kcov-build -j"$(nproc)"
          sudo cmake --install kcov-build
          kcov --version
      - name: Line coverage
        run: zig build coverage
