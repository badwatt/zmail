name: release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    # Actions cannot read a file to decide whether to run: the closest thing is
    # to watch the manifest. A push that does not touch build.zig.zon cannot be
    # a release, so it does not start this workflow at all.
    paths:
      - "build.zig.zon"
  # A failed release can be retried by hand without touching the manifest.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A suite that hangs must fail in minutes, not in the runner's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - run: zig build fmt:check
      - run: zig build test --summary all

  # The tag is the version in build.zig.zon. The `paths` filter above starts this
  # workflow when the manifest is touched; this job is what turns "touched" into
  # "changed": editing a comment in the manifest, or re-running a push, finds the
  # tag already there and does nothing.
  tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      created: ${{ steps.extract.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(awk '/\.version/{gsub(/"/, "", $3); gsub(/,/, "", $3); print $3}' build.zig.zon)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            # The tag is created through the API, not by pushing it: `git push` of a
            # ref whose commits touch a workflow file is refused for this token
            # ("refusing to allow a GitHub App to create or update workflow ..."), and
            # the commit that bumps the manifest can be right after one that does.
            # The API asks for the permission this job actually has.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$VERSION" \
              -f sha="$(git rev-parse HEAD)" > /dev/null
            echo "created=true" >> $GITHUB_OUTPUT
          fi

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - name: Build
        run: |
          NAME=$(awk '/\.name/{gsub(/[",.]/, "", $3); print $3}' build.zig.zon)
          # Four targets, cross-compiled: Zig carries the macOS libSystem stubs, so
          # this needs no Mac and no SDK. All four are what the release offers.
          # Linux is musl, so the binary is static: a glibc build would pin the
          # release to whoever has a new enough glibc. macOS links libSystem, which
          # is where its kernel interfaces are, and cannot be static.
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            zig build -Doptimize=ReleaseSafe -Dtarget="$target" --prefix "zig-out-$target" &
          done
          wait
          mkdir -p zig-out/bin
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            # The name carries the platform people recognise, not the libc.
            case "$target" in
              *-musl) asset="${target%-musl}" ;;
              *) asset="$target" ;;
            esac
            mv "zig-out-$target/bin/$NAME" "zig-out/bin/$NAME-$asset"
            rm -rf "zig-out-$target"
          done
          ls -l zig-out/bin
      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "prev=$PREV" >> $GITHUB_OUTPUT
      # The notes are built here, from the commits, by the same action the other
      # project uses: `mode: COMMIT` reads the subjects and `label_extractor` turns a
      # conventional prefix into a category. The catch-all rule at the end of both
      # lists is the point -- a commit that matches nothing is still a change, and a
      # release that drops it is how forty changes advertise two.
      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.prev.outputs.prev }}
          toTag: ${{ needs.tag.outputs.version }}
          mode: "COMMIT"
          configurationJson: |
            {
              "pr_template": "- #{{TITLE}}",
              "categories": [
                { "title": "## 🚨 Breaking Changes", "labels": ["breaking"] },
                { "title": "## 🚀 Features", "labels": ["feat", "feature"] },
                { "title": "## 🐛 Fixes", "labels": ["fix", "bug"] },
                { "title": "## ⚡️ Performance", "labels": ["perf"] },
                { "title": "## ♻️ Refactoring", "labels": ["refactor"] },
                { "title": "## 🧪 Tests", "labels": ["test"] },
                { "title": "## 📝 Docs", "labels": ["docs"] },
                { "title": "## 💄 Style", "labels": ["style"] },
                { "title": "## 👷 CI", "labels": ["ci"] },
                { "title": "## 🔨 Chores", "labels": ["chore", "build"] },
                { "title": "## 📦 Other Changes", "labels": ["other"] }
              ],
              "label_extractor": [
                { "pattern": ".*!.*|^breaking:.*", "target": "breaking", "on_property": "title" },
                { "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(: ([\\w ])+([\\s\\S]*))?", "target": "$1", "on_property": "title" },
                { "pattern": ".*", "target": "other", "on_property": "title" }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate checksums
        run: |
          cd zig-out/bin
          sha256sum ./* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          # One glob: listing a file twice makes the action upload it twice, and
          # the second upload of the same name is what fails.
          files: |
            zig-out/bin/*
          body: ${{ steps.changelog.outputs.changelog }}
