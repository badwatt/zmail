name: release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    # Actions cannot read a file to decide whether to run: the closest thing is
    # to watch the manifest. A push that does not touch build.zig.zon cannot be
    # a release, so it does not start this workflow at all.
    paths:
      - "build.zig.zon"
  # A failed release can be retried by hand without touching the manifest.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A suite that hangs must fail in minutes, not in the runner's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - run: zig build fmt:check
      - run: zig build test --summary all

  # The tag is the version in build.zig.zon. The `paths` filter above starts this
  # workflow when the manifest is touched; this job is what turns "touched" into
  # "changed": editing a comment in the manifest, or re-running a push, finds the
  # tag already there and does nothing.
  tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      created: ${{ steps.extract.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: extract
        run: |
          VERSION=$(awk '/\.version/{gsub(/"/, "", $3); gsub(/,/, "", $3); print $3}' build.zig.zon)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> $GITHUB_OUTPUT
          fi

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - name: Build
        run: |
          NAME=$(awk '/\.name/{gsub(/[",.]/, "", $3); print $3}' build.zig.zon)
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux --prefix zig-out-x86_64 &
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux --prefix zig-out-aarch64 &
          wait
          mkdir -p zig-out/bin
          mv "zig-out-x86_64/bin/$NAME" "zig-out/bin/$NAME-x86_64-linux"
          mv "zig-out-aarch64/bin/$NAME" "zig-out/bin/$NAME-aarch64-linux"
          rm -rf zig-out-x86_64 zig-out-aarch64
      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "prev=$PREV" >> $GITHUB_OUTPUT
      # The notes come from the commits, not from a service that reads labels: a
      # commit without a conventional prefix still happened, and leaving it out is
      # how a forty-change release advertises two dependabot bumps.
      - name: Changelog
        run: |
          sh scripts/changelog.sh "${{ steps.prev.outputs.prev }}" "${{ needs.tag.outputs.version }}" > notes.md
          cat notes.md
      - name: Generate checksums
        run: |
          cd zig-out/bin
          sha256sum ./* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          # One glob: listing a file twice makes the action upload it twice, and
          # the second upload of the same name is what fails.
          files: |
            zig-out/bin/*
          body_path: notes.md
